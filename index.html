<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - OS Fácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #0c0c0e;
        min-height: 100vh;
      }
      .card {
        background: #161618;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      input[type="date"] {
        font-size: 15px;
        color-scheme: dark;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.7);
      }
    </style>
  </head>
  <body class="text-slate-200">
    <div class="max-w-5xl mx-auto px-3 py-3 sm:py-4">
      <!-- Header compacto -->
      <div class="card rounded-xl p-3 mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-car-burst text-white text-sm"></i>
          </div>
          <div>
            <h1 class="text-base font-bold text-white leading-tight">OS Fácil</h1>
            <p class="text-[11px] text-slate-500">Dashboard · Auto Center</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap">
          <input
            type="date"
            id="dataInicio"
            class="bg-[#1e1e22] border border-white/10 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-orange-500 w-[118px]"
          />
          <span class="text-slate-600 text-[11px]">–</span>
          <input
            type="date"
            id="dataFim"
            class="bg-[#1e1e22] border border-white/10 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-orange-500 w-[118px]"
          />
          <button
            id="btnFiltrar"
            class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors"
          >
            <i class="fa-solid fa-filter text-[10px]"></i>
            Filtrar
          </button>
        </div>
      </div>

      <!-- OSMAR -->
      <div class="mb-3">
        <div class="flex items-center gap-2 mb-2">
          <i class="fa-solid fa-user-tie text-indigo-400 text-xs"></i>
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Osmar · Geometria</h2>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-2">
          <div class="card rounded-xl p-2.5 sm:p-3 text-center">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/15 flex items-center justify-center mx-auto mb-1.5">
              <i class="fa-solid fa-car-side text-indigo-400 text-sm"></i>
            </div>
            <p class="text-[10px] text-slate-500 uppercase mb-0.5">Alinhamento</p>
            <p id="osmarAlinhamento" class="text-xl sm:text-2xl font-bold text-white">0</p>
          </div>

          <div class="card rounded-xl p-2.5 sm:p-3 text-center">
            <div class="w-8 h-8 rounded-lg bg-amber-500/15 flex items-center justify-center mx-auto mb-1.5">
              <i class="fa-solid fa-sliders text-amber-400 text-sm"></i>
            </div>
            <p class="text-[10px] text-slate-500 uppercase mb-0.5">Camber</p>
            <p id="osmarCamber" class="text-xl sm:text-2xl font-bold text-white">0</p>
          </div>

          <div class="card rounded-xl p-2.5 sm:p-3 text-center">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center mx-auto mb-1.5">
              <i class="fa-solid fa-gauge-high text-emerald-400 text-sm"></i>
            </div>
            <p class="text-[10px] text-slate-500 uppercase mb-0.5">Caster</p>
            <p id="osmarCaster" class="text-xl sm:text-2xl font-bold text-white">0</p>
          </div>
        </div>

        <div class="bg-indigo-600 rounded-xl px-3 py-2.5 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <i class="fa-solid fa-money-bill-wave text-indigo-200 text-sm flex-shrink-0"></i>
            <div class="min-w-0">
              <p class="text-[10px] text-indigo-200 uppercase leading-none mb-0.5">Comissão Osmar</p>
              <p class="text-lg sm:text-xl font-bold text-white truncate">
                R$ <span id="osmarComissaoTotal">0,00</span>
              </p>
            </div>
          </div>
          <p class="text-[10px] text-indigo-200/80 whitespace-nowrap hidden xs:block">× R$ 10</p>
        </div>
      </div>

      <!-- GUSTAVO -->
      <div>
        <div class="flex items-center gap-2 mb-2">
          <i class="fa-solid fa-wrench text-emerald-400 text-xs"></i>
          <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Gustavo · Mecânica</h2>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2">
          <div class="card rounded-xl p-2.5 sm:p-3">
            <div class="flex items-center gap-2 mb-1.5">
              <div class="w-8 h-8 rounded-lg bg-emerald-500/15 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-screwdriver-wrench text-emerald-400 text-sm"></i>
              </div>
              <p class="text-[10px] text-slate-500 uppercase leading-tight">Mecânicas</p>
            </div>
            <p id="gustavoQtdMecanica" class="text-xl sm:text-2xl font-bold text-white">0</p>
          </div>

          <div class="card rounded-xl p-2.5 sm:p-3">
            <div class="flex items-center gap-2 mb-1.5">
              <div class="w-8 h-8 rounded-lg bg-slate-500/15 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-receipt text-slate-400 text-sm"></i>
              </div>
              <p class="text-[10px] text-slate-500 uppercase leading-tight">Faturamento</p>
            </div>
            <p id="gustavoBruto" class="text-base sm:text-lg font-bold text-white">R$ 0,00</p>
          </div>
        </div>

        <div class="bg-emerald-600 rounded-xl px-3 py-2.5 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <i class="fa-solid fa-money-bill-wave text-emerald-200 text-sm flex-shrink-0"></i>
            <div class="min-w-0">
              <p class="text-[10px] text-emerald-200 uppercase leading-none mb-0.5">Comissão Gustavo (30%)</p>
              <p id="gustavoComissao" class="text-lg sm:text-xl font-bold text-white truncate">R$ 0,00</p>
            </div>
          </div>
          <p class="text-[10px] text-emerald-200/80 whitespace-nowrap hidden xs:block">30%</p>
        </div>
      </div>

      <!-- Status -->
      <div id="mensagemStatus" class="mt-3 text-center text-xs font-medium hidden"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseUrl = "https://kiiswukzwwoznkgjyaod.supabase.co";
      const supabaseKey = "sb_publishable_WPRvraB-40Fz1RuKbd5bRg_3tGvyAxg";
      const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

      const inpInicio = document.getElementById("dataInicio");
      const inpFim = document.getElementById("dataFim");
      const btnFiltrar = document.getElementById("btnFiltrar");
      const msgStatus = document.getElementById("mensagemStatus");

      const elOsmarAlinhamento = document.getElementById("osmarAlinhamento");
      const elOsmarCamber = document.getElementById("osmarCamber");
      const elOsmarCaster = document.getElementById("osmarCaster");
      const elOsmarComissaoTotal = document.getElementById("osmarComissaoTotal");
      const elGustavoComissao = document.getElementById("gustavoComissao");
      const elGustavoBruto = document.getElementById("gustavoBruto");
      const elGustavoQtdMecanica = document.getElementById("gustavoQtdMecanica");

      const hoje = new Date();
      inpInicio.value = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split("T")[0];
      inpFim.value = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).toISOString().split("T")[0];

      async function carregarMetricas() {
        btnFiltrar.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[10px]"></i>';
        btnFiltrar.disabled = true;
        msgStatus.classList.add("hidden");

        try {
          const { data, error } = await supabaseClient
            .from("ordens_servico")
            .select("itens_servicos")
            .gte("created_at", `${inpInicio.value}T00:00:00`)
            .lte("created_at", `${inpFim.value}T23:59:59`);

          if (error) throw error;

          let qtdAlinhamento = 0;
          let qtdCamber = 0;
          let qtdCaster = 0;
          let valorMecanicaBruto = 0;
          let qtdMecanicas = 0;

          (data || []).forEach((os) => {
            const itens = Array.isArray(os.itens_servicos) ? os.itens_servicos : [];
            itens.forEach((item) => {
              const nomeServico = String(item.servico || "").toUpperCase();
              if (nomeServico.includes("ALINHAMENTO")) qtdAlinhamento++;
              if (nomeServico.includes("CAMBER")) qtdCamber++;
              if (nomeServico.includes("CASTER")) qtdCaster++;
              if (nomeServico.includes("MECANICA") || nomeServico.includes("MECÂNICA")) {
                valorMecanicaBruto += Number(item.valor) || 0;
                qtdMecanicas++;
              }
            });
          });

          elOsmarAlinhamento.textContent = qtdAlinhamento;
          elOsmarCamber.textContent = qtdCamber;
          elOsmarCaster.textContent = qtdCaster;

          const comissaoOsmar = (qtdAlinhamento + qtdCamber + qtdCaster) * 10;
          elOsmarComissaoTotal.textContent = comissaoOsmar.toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });

          const comissaoGustavo = valorMecanicaBruto * 0.3;
          elGustavoComissao.textContent = comissaoGustavo.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });
          elGustavoBruto.textContent = valorMecanicaBruto.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });
          elGustavoQtdMecanica.textContent = qtdMecanicas;
        } catch (err) {
          console.error(err);
          msgStatus.textContent = "Erro: " + err.message;
          msgStatus.className = "mt-3 text-center text-xs font-medium text-red-400 block";
        } finally {
          btnFiltrar.innerHTML = '<i class="fa-solid fa-filter text-[10px]"></i> Filtrar';
          btnFiltrar.disabled = false;
        }
      }

      btnFiltrar.addEventListener("click", carregarMetricas);
      carregarMetricas();
    </script>
  </body>
</html>
